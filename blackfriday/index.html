<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Moveletro Super Black Friday</title>
<style>
@font-face{font-family:Anton;src:url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:Mont;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2) format('woff2');font-weight:800}
@font-face{font-family:Mont;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2) format('woff2');font-weight:900}
:root{--y:#FFD21F;--y2:#FFB800;--blue:#1f3fbf}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#050505;font-family:Mont,sans-serif;color:#fff}
.abs{position:absolute}
/* fundo */
#bg{inset:0;background:radial-gradient(ellipse 80% 55% at 50% 42%,#2a2100 0%,#0d0a00 45%,#000 80%)}
#rays{left:-460px;top:-460px;width:2000px;height:2840px;opacity:0;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,200,0,.07) 0deg 6deg,transparent 6deg 18deg);
  -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0%,transparent 60%);mask-image:radial-gradient(circle at 50% 50%,#000 0%,transparent 60%)}
#floor{left:0;right:0;bottom:0;height:700px;background:radial-gradient(ellipse 70% 60% at 50% 100%,rgba(255,190,0,.28),transparent 70%)}
#grain{inset:0;opacity:.08;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#vignette{inset:0;background:radial-gradient(ellipse 75% 65% at 50% 50%,transparent 55%,rgba(0,0,0,.75) 100%)}
.p{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff6c0 0%,#ffd21f 40%,rgba(255,180,0,0) 70%)}
/* selo */
#seal{left:40px;top:560px;width:1000px;height:800px}
#seal img{position:absolute;inset:0;width:100%;height:100%}
#sealGlow{filter:blur(28px) brightness(1.6) saturate(1.4);opacity:0}
#sweep{position:absolute;inset:0;-webkit-mask-image:url(assets/selo-black-friday.png);mask-image:url(assets/selo-black-friday.png);-webkit-mask-size:100% 100%;mask-size:100% 100%;overflow:hidden}
#sweepBar{position:absolute;top:-20%;left:-60%;width:35%;height:140%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,230,.85),transparent);mix-blend-mode:screen}
/* textos */
.row{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center}
.chama{font-weight:900;line-height:.92;letter-spacing:-1px;text-transform:uppercase;text-align:left}
.chama .l1{display:block;color:#fff}
.chama .l2{display:block;color:var(--y);text-shadow:0 0 26px rgba(255,200,0,.55)}
.wa{border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px #fff inset,0 10px 30px rgba(37,211,102,.35)}
.pill{background:var(--y);color:#0a0a0a;font-weight:900;border-radius:999px;letter-spacing:-1px;box-shadow:0 0 40px rgba(255,200,0,.35);white-space:nowrap;overflow:hidden}
.pill small{font-size:.55em;vertical-align:.55em;margin-right:6px}
.anton{font-family:Anton,sans-serif;text-transform:uppercase;line-height:1}
.yel{color:var(--y);text-shadow:0 0 30px rgba(255,200,0,.5)}
.word{display:inline-block}
.mask{overflow:hidden;display:block;padding-top:.2em;margin-top:-.2em}
/* neon outline */
.neon{color:transparent;-webkit-text-stroke:6px #FFE45C;filter:drop-shadow(0 0 8px #ffd21f) drop-shadow(0 0 28px rgba(255,170,0,.75))}
#flash{inset:0;background:radial-gradient(circle at 50% 45%,#fff8d0,#ffd21f 60%,#ffb800);opacity:0}
/* caixas 3D */
.bw{position:absolute;transform-style:preserve-3d}
.cube{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:6px;backface-visibility:hidden}
.f-front{background:linear-gradient(160deg,#ffe066,#f5c400);display:flex;align-items:center;justify-content:center}
.f-front img{width:86%;border-radius:6px}
.f-front:after{content:"";position:absolute;left:50%;top:0;width:14%;height:100%;transform:translateX(-50%);background:rgba(190,140,0,.18)}
.f-back{background:#d9a900}
.f-right{background:linear-gradient(160deg,#e8b500,#c99600)}
.f-left{background:#c99600}
.f-top{background:linear-gradient(180deg,#fff1a0,#ffd84a)}
.f-top:after{content:"";position:absolute;left:43%;top:0;width:14%;height:100%;background:rgba(190,140,0,.25)}
.f-bottom{background:#a77d00}
.shadow{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%)}
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="abs"></div>
  <div id="rays" class="abs"></div>
  <div id="floor" class="abs"></div>
  <div id="particles" class="abs" style="inset:0"></div>

  <div id="boxes" class="abs" style="inset:0;pointer-events:none"></div>

  <!-- CENA 2: chama no zap -->
  <div id="s2" class="abs" style="inset:0">
    <div class="row" style="top:930px;gap:34px">
      <div class="chama" id="s2chama" style="font-size:150px"><span class="mask"><span class="l1 word">Chama</span></span><span class="mask"><span class="l2 word">no Zap</span></span></div>
      <div class="wa" id="s2wa" style="width:210px;height:210px"><svg width="120" height="120" viewBox="0 0 24 24"><path fill="#fff" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></div>
    </div>
    <div class="row" style="top:1300px"><div class="pill" id="s2pill" style="font-size:104px;padding:14px 56px"><small>(88)</small>98836-1958</div></div>
  </div>

  <!-- CENA 3: frete -->
  <div id="s3" class="abs" style="inset:0">
    <div class="row" style="top:905px"><div id="s3a" style="font-weight:800;font-size:64px;letter-spacing:1px">E aproveite</div></div>
    <div class="row" style="top:985px"><span class="mask"><span id="s3b" class="anton word" style="font-size:210px">Frete e</span></span></div>
    <div class="row" style="top:1195px"><span class="mask"><span id="s3c" class="anton word" style="font-size:210px">Montagem</span></span></div>
    <div class="row" style="top:1410px"><span class="mask"><span id="s3d" class="anton word yel" style="font-size:120px">Grátis e rápido</span></span></div>
  </div>

  <!-- CENA 4: só na black friday -->
  <div id="s4" class="abs" style="inset:0">
    <div class="row" style="top:470px"><div id="s4a" style="font-weight:900;font-size:90px;letter-spacing:6px">SÓ NA</div></div>
    <div class="row" style="top:590px"><div id="s4b" class="anton neon" style="font-size:390px">Black</div></div>
    <div class="row" style="top:990px"><div id="s4c" class="anton yel" style="font-size:390px">Friday</div></div>
    <div class="row" style="top:1430px"><img id="s4logo" src="assets/logo-moveletro.png" style="width:600px;border-radius:18px;box-shadow:0 0 50px rgba(255,200,0,.35)"></div>
  </div>

  <!-- CENA 5: cartaz final -->
  <div id="fin" class="abs" style="inset:0">
    <div class="row" style="top:880px;gap:24px">
      <div class="chama" id="fchama" style="font-size:96px"><span class="mask"><span class="l1 word">Chama</span></span><span class="mask"><span class="l2 word">no Zap</span></span></div>
      <div class="wa" id="fwa" style="width:140px;height:140px"><svg width="80" height="80" viewBox="0 0 24 24"><path fill="#fff" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></div>
    </div>
    <div class="row" style="top:1090px"><div class="pill" id="fpill" style="font-size:80px;padding:10px 46px"><small>(88)</small>98836-1958</div></div>
    <div class="row" style="top:1240px"><div id="fa" style="font-weight:800;font-size:46px;letter-spacing:1px">E aproveite</div></div>
    <div class="row" style="top:1295px"><span class="mask"><span id="fb" class="anton word" style="font-size:132px">Frete e montagem</span></span></div>
    <div class="row" style="top:1435px"><span class="mask"><span id="fc" class="anton word yel" style="font-size:96px">Grátis e rápido</span></span></div>
  </div>

  <div id="seal" class="abs">
    <img id="sealGlow" src="assets/selo-black-friday.png">
    <img id="sealImg" src="assets/selo-black-friday.png">
    <div id="sweep"><div id="sweepBar"></div></div>
  </div>

  <div id="flash" class="abs"></div>
  <div id="grain" class="abs"></div>
  <div id="vignette" class="abs"></div>
</div>

<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
gsap.ticker.lagSmoothing(0);
const $ = s => document.querySelector(s);

// ---------- aleatório determinístico ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- partículas ----------
const parts = [];
for (let i = 0; i < 46; i++) {
  const el = document.createElement('div'); el.className = 'p';
  const s = 6 + rnd() * 22;
  Object.assign(el.style, { width: s + 'px', height: s + 'px' });
  $('#particles').appendChild(el);
  parts.push({ el, x: rnd() * 1080, y0: rnd() * 2100, sp: 40 + rnd() * 110, sw: 10 + rnd() * 30, ph: rnd() * 6.28, a: .25 + rnd() * .6 });
}
function updParticles(t) {
  const k = Math.min(1, Math.max(0, (t - .5) / 1.2));
  for (const p of parts) {
    let y = (p.y0 - t * p.sp) % 2100; if (y < 0) y += 2100;
    const x = p.x + Math.sin(t * 1.3 + p.ph) * p.sw;
    p.el.style.transform = `translate(${x}px,${y - 100}px)`;
    p.el.style.opacity = (p.a * (.6 + .4 * Math.sin(t * 4 + p.ph))) * k;
  }
}

// ---------- caixas 3D ----------
function makeBox(size) {
  const w = document.createElement('div'); w.className = 'bw';
  Object.assign(w.style, { width: size + 'px', height: size * .8 + 'px', left: -size / 2 + 'px', top: -size * .4 + 'px' });
  const c = document.createElement('div'); c.className = 'cube'; w.appendChild(c);
  const W = size, H = size * .8, D = size * .8;
  const faces = [
    ['front', W, H, `translateZ(${D / 2}px)`],
    ['back', W, H, `rotateY(180deg) translateZ(${D / 2}px)`],
    ['right', D, H, `rotateY(90deg) translateZ(${W / 2}px)`],
    ['left', D, H, `rotateY(-90deg) translateZ(${W / 2}px)`],
    ['top', W, D, `rotateX(90deg) translateZ(${H / 2}px)`],
    ['bottom', W, D, `rotateX(-90deg) translateZ(${H / 2}px)`]];
  for (const [n, fw, fh, tr] of faces) {
    const f = document.createElement('div'); f.className = 'face f-' + n;
    Object.assign(f.style, { width: fw + 'px', height: fh + 'px', left: (W - fw) / 2 + 'px', top: (H - fh) / 2 + 'px', transform: tr });
    if (n === 'front') f.innerHTML = '<img src="assets/logo-moveletro.png">';
    c.appendChild(f);
  }
  const holder = document.createElement('div'); holder.className = 'abs';
  holder.style.left = 0; holder.style.top = 0; holder.appendChild(w);
  $('#boxes').appendChild(holder);
  gsap.set(holder, { transformPerspective: 1600 });
  gsap.set(c, { transformPerspective: 1600 });
  return { holder, cube: c };
}

// ---------- timeline ----------
const tl = gsap.timeline({ paused: true, defaults: { ease: 'expo.out' } });
gsap.set(['#s2', '#s3', '#s4', '#fin'], { autoAlpha: 0 });
gsap.set('#seal', { opacity: 0, scale: .6, transformOrigin: '50% 50%' });

// CENA 1 — abertura neon (0 – 2.5s)
tl.to('#rays', { opacity: 1, duration: 1.2, ease: 'power2.out' }, .2)
  .to('#seal', { scale: 1, duration: 1.1, ease: 'back.out(1.6)' }, .3)
  .to('#seal', { keyframes: [
      { opacity: .85, duration: .05 }, { opacity: .1, duration: .06 }, { opacity: 1, duration: .07 },
      { opacity: .35, duration: .05 }, { opacity: 1, duration: .08 }, { opacity: .7, duration: .04 }, { opacity: 1, duration: .05 }],
      ease: 'none' }, .3)
  .to('#sealGlow', { opacity: .9, duration: .25, ease: 'power2.out' }, .75)
  .to('#sealGlow', { opacity: .45, duration: .8, ease: 'power2.inOut' }, 1.0)
  .fromTo('#sweepBar', { left: '-60%' }, { left: '130%', duration: 1.0, ease: 'power2.inOut' }, 1.25);

// CENA 2 — selo sobe + chama no zap (2.5 – 5s)
tl.to('#seal', { y: -458, scale: .88, duration: .9, ease: 'expo.inOut' }, 2.4)
  .set('#s2', { autoAlpha: 1 }, 2.9)
  .from('#s2chama .word', { yPercent: 110, duration: .7, stagger: .1 }, 2.95)
  .from('#s2wa', { scale: 0, rotation: -40, duration: .7, ease: 'back.out(2.2)' }, 3.2)
  .fromTo('#s2pill', { clipPath: 'inset(0% 50% 0% 50% round 999px)' }, { clipPath: 'inset(0% 0% 0% 0% round 999px)', duration: .7, ease: 'expo.inOut' }, 3.35)
  .from('#s2pill', { scale: .7, duration: .7, ease: 'back.out(1.6)' }, 3.35)
  .fromTo('#sweepBar', { left: '-60%' }, { left: '130%', duration: .9, ease: 'power2.inOut' }, 3.9)
  .to('#s2', { x: -1080, duration: .6, ease: 'expo.in' }, 4.75);

// CENA 3 — frete e montagem + caixas caindo (5 – 8.5s)
tl.set('#s3', { autoAlpha: 1 }, 5.2)
  .from('#s3a', { y: 40, opacity: 0, duration: .6 }, 5.25)
  .from('#s3b', { yPercent: 105, duration: .75 }, 5.4)
  .from('#s3c', { yPercent: 105, duration: .75 }, 5.55)
  .from('#s3d', { yPercent: 105, duration: .75 }, 5.75)
  .to('#s3d', { scale: 1.06, duration: .25, ease: 'power2.out', yoyo: true, repeat: 1 }, 7.1);

const fall = [
  { x: 210, y: 1700, s: 260, d: 5.15, r: -18 },
  { x: 860, y: 1690, s: 300, d: 5.35, r: 14 },
  { x: 540, y: 1760, s: 230, d: 5.6, r: 6 }];
const fallBoxes = fall.map(f => {
  const b = makeBox(f.s);
  gsap.set(b.holder, { x: f.x, y: -300, opacity: 0 });
  tl.set(b.holder, { opacity: 1 }, f.d)
    .to(b.holder, { y: f.y, duration: .9, ease: 'bounce.out' }, f.d)
    .fromTo(b.cube, { rotationX: -60, rotationY: f.r * 3, rotationZ: f.r }, { rotationX: -14, rotationY: f.r * 1.5, rotationZ: f.r * .3, duration: 1.1, ease: 'power3.out' }, f.d);
  return b;
});

// FLASH → CENA 4 (8.5 – 11.5s)
tl.to('#flash', { opacity: 1, duration: .15, ease: 'power2.in' }, 8.35)
  .set(['#s3'], { autoAlpha: 0 }, 8.5)
  .set(fallBoxes.map(b => b.holder), { opacity: 0 }, 8.5)
  .set('#seal', { opacity: 0 }, 8.5)
  .set('#s4', { autoAlpha: 1 }, 8.5)
  .to('#flash', { opacity: 0, duration: .45, ease: 'power2.out' }, 8.5)
  .from('#s4a', { y: 50, opacity: 0, duration: .6 }, 8.55)
  .from('#s4b', { scale: 1.25, opacity: 0, duration: .9 }, 8.6)
  .to('#s4b', { keyframes: [{ opacity: .3, duration: .05 }, { opacity: 1, duration: .06 }, { opacity: .5, duration: .04 }, { opacity: 1, duration: .07 }], ease: 'none' }, 9.15)
  .from('#s4c', { yPercent: 40, opacity: 0, duration: .8 }, 8.8)
  .from('#s4logo', { y: 60, opacity: 0, duration: .7 }, 9.2)
  .to('#s4', { scale: 1.04, duration: 2.6, ease: 'none', transformOrigin: '50% 50%' }, 8.7);

const drift = [
  { x0: 1250, x1: -200, y: 360, s: 130, d: 8.5, r: 20 },
  { x0: 1300, x1: -250, y: 1790, s: 220, d: 8.6, r: -25 },
  { x0: -250, x1: 1250, y: 150, s: 100, d: 9.0, r: 30 }];
const driftBoxes = drift.map(f => {
  const b = makeBox(f.s);
  gsap.set(b.holder, { x: f.x0, y: f.y, opacity: 0 });
  tl.set(b.holder, { opacity: 1 }, f.d)
    .to(b.holder, { x: f.x1, duration: 2.9, ease: 'none' }, f.d)
    .fromTo(b.cube, { rotationX: -20, rotationY: 0, rotationZ: 0 }, { rotationX: -20 + f.r, rotationY: f.r * 8, rotationZ: f.r, duration: 2.9, ease: 'none' }, f.d);
  return b;
});

// FLASH → CENA 5 cartaz final (11.5 – 15s)
tl.to('#flash', { opacity: 1, duration: .15, ease: 'power2.in' }, 11.35)
  .set('#s4', { autoAlpha: 0 }, 11.5)
  .set(driftBoxes.map(b => b.holder), { opacity: 0 }, 11.5)
  .set('#fin', { autoAlpha: 1 }, 11.5)
  .to('#flash', { opacity: 0, duration: .45, ease: 'power2.out' }, 11.5)
  .fromTo('#seal', { opacity: 1, scale: .7 }, { scale: .88, duration: .8, ease: 'back.out(1.8)' }, 11.5)
  .from('#fchama .word', { yPercent: 110, duration: .6, stagger: .08 }, 11.7)
  .from('#fwa', { scale: 0, rotation: -40, duration: .6, ease: 'back.out(2.2)' }, 11.85)
  .fromTo('#fpill', { clipPath: 'inset(0% 50% 0% 50% round 999px)' }, { clipPath: 'inset(0% 0% 0% 0% round 999px)', duration: .6, ease: 'expo.inOut' }, 11.95)
  .from('#fa', { y: 30, opacity: 0, duration: .5 }, 12.1)
  .from('#fb', { yPercent: 105, duration: .6 }, 12.2)
  .from('#fc', { yPercent: 105, duration: .6 }, 12.35)
  .fromTo('#sweepBar', { left: '-60%' }, { left: '130%', duration: 1.0, ease: 'power2.inOut' }, 13.0)
  .to('#fpill', { scale: 1.06, duration: .3, ease: 'power2.out', yoyo: true, repeat: 1 }, 13.6);

const corner = [
  { x: 130, y: 1745, s: 240, d: 11.9, r: -16 },
  { x: 950, y: 1730, s: 270, d: 12.0, r: 14 }];
const cornerBoxes = corner.map(f => {
  const b = makeBox(f.s);
  gsap.set(b.holder, { x: f.x, y: 2200, opacity: 0 });
  tl.set(b.holder, { opacity: 1 }, f.d)
    .to(b.holder, { y: f.y, duration: .9, ease: 'back.out(1.4)' }, f.d)
    .fromTo(b.cube, { rotationX: -40, rotationY: f.r * 3, rotationZ: f.r }, { rotationX: -14, rotationY: f.r * 1.6, rotationZ: f.r * .4, duration: 1, ease: 'power3.out' }, f.d);
  return { b, f };
});
tl.to({}, { duration: .01 }, 15.1); // duração total

// movimento contínuo (não-timeline)
function updIdle(t) {
  $('#rays').style.transform = `rotate(${t * 4}deg)`;
  if (t > 1.8) $('#sealGlow').style.filter = `blur(28px) brightness(${1.5 + .25 * Math.sin(t * 3.2)}) saturate(1.4)`;
  if (t > 13) cornerBoxes.forEach(({ b, f }, i) => {
    b.holder.style.translate = `0 ${Math.sin((t - 13) * 2 + i * 1.6) * 10}px`;
  });
}

window.seek = t => { tl.seek(t, false); updParticles(t); updIdle(t); };
window.DURATION = 15;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]);
window.seek(0);
</script>
</body>
</html>
