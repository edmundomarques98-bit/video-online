<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Moveletro Black Friday Vendedor</title>
<style>
@font-face{font-family:Anton;src:url(../node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2) format('woff2');font-weight:400}
@font-face{font-family:Mont;src:url(../node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2) format('woff2');font-weight:800}
@font-face{font-family:Mont;src:url(../node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2) format('woff2');font-weight:900}
:root{--y:#FFD21F;--y2:#FFB800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Mont,sans-serif;color:#fff}
.abs{position:absolute}
.row{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center}
.anton{font-family:Anton,sans-serif;text-transform:uppercase;line-height:1}
.yel{color:var(--y);text-shadow:0 0 30px rgba(255,200,0,.5)}
.word{display:inline-block}
.mask{overflow:hidden;display:block;padding-top:.2em;margin-top:-.2em}
.neon{color:transparent;-webkit-text-stroke:7px #FFE45C;filter:drop-shadow(0 0 8px #ffd21f) drop-shadow(0 0 30px rgba(255,170,0,.8))}
.out{text-shadow:0 0 0 #000,0 6px 0 #000,0 0 18px rgba(0,0,0,.85),0 0 40px rgba(0,0,0,.6);-webkit-text-stroke:3px #000;paint-order:stroke fill}
.pill{background:var(--y);color:#0a0a0a;font-weight:900;border-radius:999px;letter-spacing:-1px;box-shadow:0 0 40px rgba(255,200,0,.4);white-space:nowrap;overflow:hidden}
.pill small{font-size:.55em;vertical-align:.55em;margin-right:6px}

/* vídeo */
#vid{inset:0;overflow:hidden}
#frame{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;transform-origin:50% 30%}
#topShade{left:0;right:0;top:0;height:420px;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
#botShade{left:0;right:0;bottom:0;height:1000px;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.55) 45%,transparent 100%)}
#cardShade{left:0;right:0;top:0;bottom:0;opacity:0;background:linear-gradient(180deg,transparent 0%,transparent 46%,rgba(0,0,0,.72) 62%,rgba(0,0,0,.85) 100%)}
#tint{inset:0;background:radial-gradient(ellipse 75% 65% at 50% 45%,transparent 60%,rgba(40,25,0,.55) 100%)}

/* legendas */
#cap{left:50px;right:50px;top:1460px;text-align:center;font-family:Anton,sans-serif;font-size:118px;line-height:1.05;text-transform:uppercase}
#cap .w{display:inline-block;margin:0 .02em;color:#fff;
  text-shadow:0 7px 0 #000,0 0 22px rgba(0,0,0,.9);-webkit-text-stroke:9px #000;paint-order:stroke fill}
#cap .w.on{color:var(--y)}

/* cartões */
.card{position:absolute;inset:0;visibility:hidden}
#band{left:-80px;right:-80px;top:1350px;height:250px;background:var(--y);transform:rotate(-5deg);box-shadow:0 0 60px rgba(255,200,0,.55),0 20px 40px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;overflow:hidden}
#bandTxt{color:#0a0a0a;font-size:190px}
#logoPlate{width:760px;filter:drop-shadow(0 12px 30px rgba(0,0,0,.7))}

/* selo */
#seal{left:160px;top:1000px;width:760px;height:608px;transform-origin:0 0}
#seal img{position:absolute;inset:0;width:100%;height:100%}
#sealGlow{filter:blur(24px) brightness(1.6) saturate(1.4);opacity:0}
#sweep{position:absolute;inset:0;-webkit-mask-image:url(../assets/selo-black-friday.png);mask-image:url(../assets/selo-black-friday.png);-webkit-mask-size:100% 100%;mask-size:100% 100%;overflow:hidden}
#sweepBar{position:absolute;top:-20%;left:-60%;width:35%;height:140%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,230,.85),transparent);mix-blend-mode:screen}

/* cartaz final */
#fin{inset:0;visibility:hidden}
#fbg{inset:0;background:radial-gradient(ellipse 80% 55% at 50% 42%,#2a2100 0%,#0d0a00 45%,#000 80%)}
#rays{left:-460px;top:-460px;width:2000px;height:2840px;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,200,0,.07) 0deg 6deg,transparent 6deg 18deg);-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0%,transparent 60%);mask-image:radial-gradient(circle at 50% 50%,#000 0%,transparent 60%)}
#floor{left:0;right:0;bottom:0;height:700px;background:radial-gradient(ellipse 70% 60% at 50% 100%,rgba(255,190,0,.28),transparent 70%)}
.p{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff6c0 0%,#ffd21f 40%,rgba(255,180,0,0) 70%)}
.chama{font-weight:900;line-height:.92;letter-spacing:-1px;text-transform:uppercase;text-align:left}
.chama .l1{display:block;color:#fff}
.chama .l2{display:block;color:var(--y);text-shadow:0 0 26px rgba(255,200,0,.55)}
.wa{border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px #fff inset,0 10px 30px rgba(37,211,102,.35)}

#flash{inset:0;background:radial-gradient(circle at 50% 45%,#fff8d0,#ffd21f 60%,#ffb800);opacity:0}
#grain{inset:0;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style>
</head>
<body>
<div id="stage">
  <div id="vid" class="abs">
    <img id="frame" src="assets/frames/f0001.jpg">
    <div id="tint" class="abs"></div>
    <div id="topShade" class="abs"></div>
    <div id="botShade" class="abs"></div>
    <div id="cardShade" class="abs"></div>
  </div>

  <div id="cap" class="abs"></div>

  <!-- É HOJE 11/11 -->
  <div id="cHoje" class="card">
    <div class="row" style="top:1180px"><span class="mask"><span id="hA" class="anton word out" style="font-size:170px">É hoje</span></span></div>
    <div class="row" style="top:1360px"><span id="hB" class="anton neon" style="font-size:330px">11/11</span></div>
  </div>

  <!-- JÁ COMEÇOU -->
  <div id="cJa" class="card">
    <div id="band" class="abs"><span id="bandTxt" class="anton word">Já começou!</span></div>
  </div>

  <!-- HOJE ATÉ ÀS 18H -->
  <div id="c18" class="card">
    <div class="row" style="top:1210px"><span class="mask"><span id="tA" class="anton word out" style="font-size:150px">Hoje até às</span></span></div>
    <div class="row" style="top:1400px"><div id="tB" class="pill anton" style="font-size:210px;padding:10px 70px 18px;font-weight:400;letter-spacing:2px">18 horas</div></div>
  </div>

  <!-- DESCONTO -->
  <div id="cDesc" class="card">
    <div class="row" style="top:1060px"><span class="mask"><span id="dA" class="word out" style="font-weight:900;font-size:78px;letter-spacing:1px;text-transform:uppercase">Desconto de</span></span></div>
    <div class="row" style="top:1160px;gap:70px">
      <span id="d30" class="anton out" style="font-size:210px">30%</span>
      <span id="d40" class="anton out" style="font-size:210px">40%</span>
    </div>
    <div class="row" style="top:1390px;gap:30px;align-items:center">
      <span id="dAte" class="anton yel out" style="font-size:130px">Até</span>
      <span id="d50" class="anton neon" style="font-size:340px">50%</span>
    </div>
  </div>

  <!-- VEM PRA MOVELETRO -->
  <div id="cVem" class="card">
    <div class="row" style="top:1210px"><span class="mask"><span id="vA" class="anton word out" style="font-size:170px">Vem pra</span></span></div>
    <div class="row" style="top:1420px"><img id="logoPlate" src="../assets/logo-moveletro.png"></div>
  </div>

  <!-- CARTAZ FINAL -->
  <div id="fin">
    <div id="fbg" class="abs"></div>
    <div id="rays" class="abs"></div>
    <div id="floor" class="abs"></div>
    <div id="particles" class="abs" style="inset:0"></div>
    <div class="row" style="top:900px;gap:30px">
      <div class="chama" id="fchama" style="font-size:118px"><span class="mask"><span class="l1 word">Chama</span></span><span class="mask"><span class="l2 word">no Zap</span></span></div>
      <div class="wa" id="fwa" style="width:170px;height:170px"><svg width="96" height="96" viewBox="0 0 24 24"><path fill="#fff" d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></div>
    </div>
    <div class="row" style="top:1160px"><div class="pill" id="fpill" style="font-size:96px;padding:12px 52px"><small>(88)</small>98836-1958</div></div>
    <div class="row" style="top:1340px"><span class="mask"><span id="fh" class="anton word" style="font-size:118px">Hoje até às <span class="yel">18h</span></span></span></div>
  </div>

  <div id="seal" class="abs">
    <img id="sealGlow" src="../assets/selo-black-friday.png">
    <img id="sealImg" src="../assets/selo-black-friday.png">
    <div id="sweep"><div id="sweepBar"></div></div>
  </div>

  <div id="flash" class="abs"></div>
  <div id="grain" class="abs"></div>
</div>

<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script>
gsap.ticker.lagSmoothing(0);
const $ = s => document.querySelector(s);
const FPS = 30, N_FRAMES = 919, VIDEO_END = 30.6, DURATION = 34.2;

// ---------- legendas (palavra, início em s) — fala do vídeo ----------
const G = [
  [[ 'Lembra', 4.88 ], [ 'que', 5.30 ], [ 'eu', 5.48 ], [ 'prometi', 5.72 ]],
  [[ 'que', 6.36 ], [ 'hoje', 6.62 ], [ 'tinha', 7.00 ], [ 'promoção', 7.38 ]],
  [[ 'na', 8.08 ], [ 'Moveletro?', 8.32 ]],
  [[ 'Avisa', 10.94 ], [ 'pra', 11.36 ], [ 'todo', 11.78 ], [ 'mundo!', 12.14 ]],
  [[ 'Lembra', 12.72 ], [ 'o', 13.04 ], [ 'vizinho', 13.32 ]],
  [[ 'que', 13.70 ], [ 'está', 13.86 ], [ 'no', 14.04 ], [ 'interior,', 14.26 ]],
  [[ 'os', 15.00 ], [ 'colegas', 15.20 ], [ 'de', 15.46 ], [ 'trabalho,', 15.70 ]],
  [[ 'a', 16.42 ], [ 'família!', 16.58 ]],
  [[ 'Vem', 17.82 ], [ 'pra', 17.96 ], [ 'Moveletro!', 18.20 ]],
  [[ 'Nós', 18.98 ], [ 'estamos', 19.12 ], [ 'de', 19.48 ], [ 'plantão', 19.72 ]],
  [[ 'esperando', 20.08 ], [ 'por', 20.46 ], [ 'você!', 20.78 ]],
  [[ 'Muita', 24.28 ], [ 'promoção!', 24.66 ]],
];
const capEl = $('#cap');
const capGroups = G.map((g, i) => {
  const div = document.createElement('div'); div.style.display = 'none';
  const words = g.map(([txt, s]) => {
    const sp = document.createElement('span'); sp.className = 'w'; sp.textContent = txt;
    div.appendChild(sp); div.appendChild(document.createTextNode(' '));
    return { sp, s };
  });
  capEl.appendChild(div);
  const next = G[i + 1] ? G[i + 1][0][1] : 25.5;
  return { div, words, start: g[0][1] - .04, end: Math.min(next - .04, g[g.length - 1][1] + 1.1) };
});
function updCaptions(t) {
  for (const g of capGroups) {
    const vis = t >= g.start && t < g.end;
    g.div.style.display = vis ? 'block' : 'none';
    if (!vis) continue;
    let active = -1;
    g.words.forEach((w, i) => { if (t >= w.s - .04) active = i; });
    g.words.forEach((w, i) => {
      const k = Math.min(1, Math.max(0, (t - (w.s - .04)) / .12));
      const shown = i <= active;
      w.sp.style.opacity = shown ? 1 : 0;
      w.sp.style.transform = shown ? `scale(${.7 + .3 * (1 - Math.pow(1 - k, 3)) + (i === active ? .06 : 0)})` : 'scale(.7)';
      w.sp.classList.toggle('on', i === active);
    });
  }
}

// ---------- zoom do vídeo (cortes secos em ritmo de fala) ----------
const zooms = [ // [início, escala]
  [0, 1.0], [2.42, 1.12], [4.88, 1.0], [6.36, 1.06], [8.08, 1.0], [9.24, 1.14], [10.94, 1.0],
  [12.72, 1.06], [15.0, 1.0], [16.42, 1.08], [17.82, 1.0], [18.98, 1.06], [20.08, 1.0],
  [21.76, 1.12], [24.28, 1.0], [25.6, 1.06], [27.56, 1.16], [29.12, 1.04]];
function updZoom(t) {
  let i = 0; while (i + 1 < zooms.length && t >= zooms[i + 1][0]) i++;
  const [s0, z] = zooms[i];
  const zPrev = i ? zooms[i - 1][1] : z;
  const k = Math.min(1, (t - s0) / .18), e = 1 - Math.pow(1 - k, 3);
  let zz = zPrev + (z - zPrev) * e + (t - s0) * .008; // leve push contínuo
  let shake = 0;
  if (t >= 27.84 && t < 28.3) shake = Math.sin(t * 90) * 10 * (1 - (t - 27.84) / .46);
  $('#frame').style.transform = `translate(${shake}px,${shake * .5}px) scale(${zz})`;
}

// ---------- partículas (cartaz final) ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const parts = [];
for (let i = 0; i < 46; i++) {
  const el = document.createElement('div'); el.className = 'p';
  const s = 6 + rnd() * 22;
  Object.assign(el.style, { width: s + 'px', height: s + 'px' });
  $('#particles').appendChild(el);
  parts.push({ el, x: rnd() * 1080, y0: rnd() * 2100, sp: 40 + rnd() * 110, sw: 10 + rnd() * 30, ph: rnd() * 6.28, a: .25 + rnd() * .6 });
}
function updParticles(t) {
  for (const p of parts) {
    let y = (p.y0 - t * p.sp) % 2100; if (y < 0) y += 2100;
    const x = p.x + Math.sin(t * 1.3 + p.ph) * p.sw;
    p.el.style.transform = `translate(${x}px,${y - 100}px)`;
    p.el.style.opacity = p.a * (.6 + .4 * Math.sin(t * 4 + p.ph));
  }
}

// ---------- timeline ----------
const tl = gsap.timeline({ paused: true, defaults: { ease: 'expo.out' } });
gsap.set('#seal', { opacity: 0, scale: .6, x: 380 * .4, y: 304 * .4 });
const show = (sel, a, b) => tl.set(sel, { visibility: 'visible' }, a).set(sel, { visibility: 'hidden' }, b);

// ABERTURA — selo acende com neon sobre o vídeo (0 – 2.3s)
tl.fromTo('#botShade', { opacity: .6 }, { opacity: 1, duration: .3 }, 0)
  .to('#seal', { scale: 1, x: 0, y: 0, duration: .9, ease: 'back.out(1.6)' }, .05)
  .to('#seal', { keyframes: [
      { opacity: .85, duration: .05 }, { opacity: .1, duration: .06 }, { opacity: 1, duration: .07 },
      { opacity: .35, duration: .05 }, { opacity: 1, duration: .08 }, { opacity: .7, duration: .04 }, { opacity: 1, duration: .05 }],
      ease: 'none' }, .05)
  .to('#sealGlow', { opacity: .9, duration: .25, ease: 'power2.out' }, .45)
  .to('#sealGlow', { opacity: .45, duration: .8, ease: 'power2.inOut' }, .7)
  .fromTo('#sweepBar', { left: '-60%' }, { left: '130%', duration: .9, ease: 'power2.inOut' }, .9)
  // selo vai para o canto
  .to('#seal', { scale: 270 / 760, x: 36 - 160, y: 64 - 1000, duration: .7, ease: 'expo.inOut' }, 2.0)
  .to('#sealGlow', { opacity: .3, duration: .4 }, 2.2);

// É HOJE 11/11 (2.42 – 4.8)
show('#cHoje', 2.42, 4.82);
tl.from('#hA', { yPercent: 110, duration: .5 }, 2.42)
  .fromTo('#hB', { opacity: 0, scale: .6 }, { opacity: 1, scale: 1, duration: .6, ease: 'back.out(1.8)' }, 3.08)
  .to('#hB', { keyframes: [{ opacity: .3, duration: .05 }, { opacity: 1, duration: .06 }, { opacity: .5, duration: .04 }, { opacity: 1, duration: .06 }], ease: 'none' }, 3.2)
  .to('#cHoje', { opacity: 0, duration: .15, ease: 'none' }, 4.66);

// JÁ COMEÇOU (9.24 – 10.85)
show('#cJa', 9.2, 10.85);
tl.to('#flash', { opacity: .55, duration: .08, ease: 'power2.in' }, 9.16)
  .to('#flash', { opacity: 0, duration: .35, ease: 'power2.out' }, 9.24)
  .fromTo('#band', { scaleX: 0 }, { scaleX: 1, duration: .4, ease: 'expo.out' }, 9.2)
  .from('#bandTxt', { yPercent: 120, duration: .45 }, 9.32)
  .to('#band', { scale: 1.05, duration: .2, yoyo: true, repeat: 1, ease: 'power2.out' }, 9.9)
  .to('#band', { scaleX: 0, duration: .25, ease: 'expo.in' }, 10.6);

// HOJE ATÉ ÀS 18H (21.76 – 24.2)
show('#c18', 21.72, 24.22);
tl.from('#tA', { yPercent: 110, duration: .5 }, 21.76)
  .fromTo('#tB', { clipPath: 'inset(0% 50% 0% 50% round 999px)', scale: .7 }, { clipPath: 'inset(0% 0% 0% 0% round 999px)', scale: 1, duration: .55, ease: 'back.out(1.6)' }, 22.58)
  .to('#tB', { scale: 1.07, duration: .22, yoyo: true, repeat: 1, ease: 'power2.out' }, 23.3)
  .to('#c18', { opacity: 0, duration: .15, ease: 'none' }, 24.06);

// DESCONTO 30, 40, ATÉ 50% (25.6 – 29.1)
show('#cDesc', 25.56, 29.12);
tl.from('#dA', { yPercent: 110, duration: .45 }, 25.6)
  .fromTo('#d30', { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: .35, ease: 'power3.out' }, 26.12)
  .fromTo('#d40', { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: .35, ease: 'power3.out' }, 26.66)
  .from('#dAte', { x: -60, opacity: 0, duration: .35 }, 27.54)
  .to('#flash', { opacity: .7, duration: .08, ease: 'power2.in' }, 27.78)
  .to('#flash', { opacity: 0, duration: .4, ease: 'power2.out' }, 27.86)
  .fromTo('#d50', { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: .45, ease: 'back.out(1.4)' }, 27.82)
  .to('#d50', { keyframes: [{ opacity: .4, duration: .05 }, { opacity: 1, duration: .06 }], ease: 'none' }, 28.3)
  .to('#cDesc', { opacity: 0, duration: .12, ease: 'none' }, 29.0);

// VEM PRA MOVELETRO (29.12 – 30.6)
show('#cVem', 29.1, 30.62);
tl.from('#vA', { yPercent: 110, duration: .45 }, 29.12)
  .fromTo('#logoPlate', { scale: 0, rotation: -8 }, { scale: 1, rotation: 0, duration: .55, ease: 'back.out(2)' }, 29.72);

// FLASH → CARTAZ FINAL (30.6 – 34.2)
tl.to('#flash', { opacity: 1, duration: .15, ease: 'power2.in' }, 30.45)
  .set('#fin', { visibility: 'visible' }, 30.6)
  .set(['#vid', '#cap'], { visibility: 'hidden' }, 30.6)
  .to('#flash', { opacity: 0, duration: .45, ease: 'power2.out' }, 30.6)
  .fromTo('#seal', { scale: 800 / 760 * .85, x: 140 - 160, y: 150 - 1000 }, { scale: 800 / 760, x: 140 - 160, y: 120 - 1000, duration: .8, ease: 'back.out(1.8)' }, 30.6)
  .to('#sealGlow', { opacity: .55, duration: .4 }, 30.6)
  .from('#fchama .word', { yPercent: 110, duration: .6, stagger: .08 }, 30.8)
  .from('#fwa', { scale: 0, rotation: -40, duration: .6, ease: 'back.out(2.2)' }, 30.95)
  .fromTo('#fpill', { clipPath: 'inset(0% 50% 0% 50% round 999px)' }, { clipPath: 'inset(0% 0% 0% 0% round 999px)', duration: .6, ease: 'expo.inOut' }, 31.05)
  .from('#fh', { yPercent: 110, duration: .6 }, 31.3)
  .fromTo('#sweepBar', { left: '-60%' }, { left: '130%', duration: 1.0, ease: 'power2.inOut' }, 31.9)
  .to('#fpill', { scale: 1.06, duration: .3, ease: 'power2.out', yoyo: true, repeat: 1 }, 32.6);
tl.to({}, { duration: .01 }, DURATION);

const cardWin = [[2.42, 4.8], [9.2, 10.8], [21.76, 24.1], [25.6, 29.05], [29.12, 30.6]];
function updCardShade(t) {
  let o = 0;
  for (const [a, b] of cardWin) o = Math.max(o, Math.min(1, (t - a) / .15, (b - t) / .15));
  $('#cardShade').style.opacity = Math.max(0, o);
}
function updIdle(t) {
  $('#rays').style.transform = `rotate(${t * 4}deg)`;
  if (t > 1.2) $('#sealGlow').style.filter = `blur(24px) brightness(${1.5 + .25 * Math.sin(t * 3.2)}) saturate(1.4)`;
}

const frame = $('#frame');
window.seek = async t => {
  tl.seek(t, false); updCardShade(t); updCaptions(t); updZoom(t); updIdle(t);
  if (t >= 30.6) updParticles(t);
  if (t < VIDEO_END) {
    const idx = Math.min(N_FRAMES, Math.floor(t * FPS + 1e-6) + 1);
    const src = `assets/frames/f${String(idx).padStart(4, '0')}.jpg`;
    if (!frame.src.endsWith(src)) { frame.src = src; await frame.decode().catch(() => {}); }
  }
};
window.DURATION = DURATION;
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]);
